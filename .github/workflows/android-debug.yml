name: Android Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Create local Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Full JVM regression suite
        run: >-
          ./gradlew
          :core:simulation:test
          :core:worldgen:test
          :core:civilization:test
          :core:people:test
          :core:economy:test
          :core:evolution:test
          :core:society:test
          :core:history:test
          :core:storage:test
          :core:scene:test
          :feature:adult:test
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: chronosphere-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
